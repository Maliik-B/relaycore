name: CI

# Build + test on every push to master and on every pull request.
# ubuntu-latest ships Docker, so the Testcontainers integration tests
# (Postgres + Redis + Kafka) run on the runner as-is — no services: block needed.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
