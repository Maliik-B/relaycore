spring:
  application:
    name: relaycore
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relaycore}
    username: ${DB_USER:relaycore}
    password: ${DB_PASSWORD:relaycore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    consumer:
      group-id: relaycore
      auto-offset-reset: earliest
      # Outbox payloads travel as JSON strings, so both sides use the plain String (de)serializers —
      # no JsonDeserializer trusted-package config; events are parsed with the shared ObjectMapper.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: relaycore

relaycore:
  jwt:
    # HS-signed secret. ASCII >= 32 bytes (this default is comfortably longer). Override in prod via JWT_SECRET.
    secret: ${JWT_SECRET:relaycore-local-development-signing-secret-change-me-before-prod}
    # ISO-8601 duration; how long an issued access token stays valid.
    expiry: ${JWT_EXPIRY:PT1H}
  outbox:
    # Relay cadence + batch sizing. poll-interval-ms is also referenced by OutboxRelay's @Scheduled.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:5000}
  matchmaking:
    # How often MatchmakingWorker scans the queue and forms matches (referenced by its @Scheduled).
    poll-interval-ms: ${MATCHMAKING_POLL_INTERVAL_MS:1000}

# Prod profile (Railway + Upstash) overrides the above via env vars (DB_URL, REDIS_HOST,
# KAFKA_BOOTSTRAP, JWT_SECRET, etc.) and adds SASL_SSL for Upstash Kafka. Add application-prod.yml in the deploy milestone.
