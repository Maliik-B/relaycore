spring:
  application:
    name: relaycore
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relaycore}
    username: ${DB_USER:relaycore}
    password: ${DB_PASSWORD:relaycore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    consumer:
      group-id: relaycore
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: relaycore

# Prod profile (Railway + Upstash) overrides the above via env vars (DB_URL, REDIS_HOST,
# KAFKA_BOOTSTRAP, etc.) and adds SASL_SSL for Upstash Kafka. Add application-prod.yml in the deploy milestone.
